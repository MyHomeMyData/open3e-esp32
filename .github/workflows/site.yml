# Build the firmware and publish the browser-flashing site.
#
# A tag fills the `release` slot, a push to main fills `dev`. Both live side by
# side on the server, which is why rsync runs without --delete: this job only
# produced one of the two channels and must not remove the other.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same tag the firmware is developed against; a mismatch here would ship
    # something nobody has run.
    container: espressif/idf:v6.1

    steps:
      - uses: actions/checkout@v4
        with:
          # CMakeLists.txt derives PROJECT_VER from `git describe --tags`.
          # A shallow clone would silently degrade that to a timestamp, and the
          # version on the status page is how anyone tells builds apart.
          fetch-depth: 0

      - name: Trust the workspace
        # The container runs as a different user than the one that checked out,
        # so git refuses to read the repository without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Host build dependencies
        # The host suite links against the system cJSON, which the ESP-IDF
        # image has no reason to carry.
        run: apt-get update -qq && apt-get install -y -qq libcjson-dev

      - name: Fetch open3e and build the datapoint database
        # data/ is gitignored: the database is generated from pinned upstream
        # commits, so without this step the storage partition would be empty.
        run: make setup db

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Host test suite
        # The vectors are generated by running open3e's own Python codecs, and
        # are gitignored for it -- without this the suite has nothing to compare
        # against. Failing here stops the publish, which is the point.
        run: make fixtures test

      - name: Assemble the site
        run: |
          CHANNEL=dev
          case "$GITHUB_REF" in refs/tags/*) CHANNEL=release ;; esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          python3 tools/build_site.py --channel "$CHANNEL"
        id: assemble

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.assemble.outputs.channel }}
          path: build/site
          retention-days: 30

      - name: Deploy
        # Skipped unless a host is configured. The GitHub-hosted runner has to
        # be able to reach it, so a LAN address will not do -- see site/README.
        if: vars.DEPLOY_HOST != ''
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          command -v ssh >/dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # A pinned host key rather than StrictHostKeyChecking=no: without it
          # the deploy would trust whatever answers, which is the whole attack.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # tar, not rsync: same reason as `make deploy` -- the target has no
          # rsync, and nothing here is worth installing one for.
          tar -C build/site -czf - . | \
            ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$HOST" \
                "mkdir -p '$PATH_ON_HOST' && tar -C '$PATH_ON_HOST' -xzf -"
