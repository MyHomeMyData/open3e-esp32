# Build the firmware and publish the browser-flashing site.
#
# A tag fills the `release` slot, a push to main fills `dev`. Each run leaves
# its channel as an artifact; the web server fetches the newest one of each
# (site/pull/) and keeps the other channel's files untouched.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same tag the firmware is developed against; a mismatch here would ship
    # something nobody has run.
    container: espressif/idf:v6.1

    steps:
      - uses: actions/checkout@v4
        with:
          # CMakeLists.txt derives PROJECT_VER from `git describe --tags`.
          # A shallow clone would silently degrade that to a timestamp, and the
          # version on the status page is how anyone tells builds apart.
          fetch-depth: 0

      - name: Trust the workspace
        # The container runs as a different user than the one that checked out,
        # so git refuses to read the repository without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tag matches version.txt
        # A release is the pair of tag and version.txt. If they disagree, the
        # flash page would offer "v0.3.0" while the board reports 0.2.0 -- the
        # kind of mismatch nobody notices until an adapter refuses to connect.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver="$(tr -d '[:space:]' < version.txt)"
          test "$tag" = "$ver" || { echo "tag v$tag but version.txt says $ver"; exit 1; }

      - name: Host build dependencies
        # The host suite links against the system cJSON, which the ESP-IDF
        # image has no reason to carry.
        run: apt-get update -qq && apt-get install -y -qq libcjson-dev

      - name: Fetch open3e and build the datapoint database
        # data/ is gitignored: the database is generated from pinned upstream
        # commits, so without this step the storage partition would be empty.
        run: make setup db

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Host test suite
        # The vectors are generated by running open3e's own Python codecs, and
        # are gitignored for it -- without this the suite has nothing to compare
        # against. Failing here stops the publish, which is the point.
        run: make fixtures test

      - name: Assemble the site
        run: |
          CHANNEL=dev
          case "$GITHUB_REF" in refs/tags/*) CHANNEL=release ;; esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          python3 tools/build_site.py --channel "$CHANNEL"
        id: assemble

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.assemble.outputs.channel }}
          path: build/site
          retention-days: 30

      # No deploy step: the web server sits on a home network, out of reach of
      # GitHub's runners, so it pulls the artifact above itself -- see
      # site/pull/ and `make install-pull`. A push from here was skipped for
      # weeks without anyone noticing (issue #3), which is the argument for
      # a pull with a log on the far side.
